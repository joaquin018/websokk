services:
  database:
    image: postgres:18.3
    container_name: comandadb_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comandadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comandadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: backend_container
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@database:5432/comandadb
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
