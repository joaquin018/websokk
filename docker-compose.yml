services:
  pgdb:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: comandadb
    volumes:
      - pgdata_18:/var/lib/postgresql
    networks:
      - comandas_net

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@pgdb:5432/comandadb
    networks:
      - comandas_net
    depends_on:
      - pgdb

networks:
  comandas_net:
    driver: bridge

volumes:
  pgdata_18:
